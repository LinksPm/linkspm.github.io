<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#292b2d;font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:1450px;margin:auto;padding:30px 38px 70px}header{display:flex;align-items:center;gap:16px;font-size:clamp(22px,3vw,34px);font-weight:700;letter-spacing:-1.5px}.logo{display:grid;place-items:center;background:#dff37d;width:66px;height:66px;border-radius:18px;color:#222;font-size:27px;letter-spacing:-2px}.tag{font-size:12px;color:#858585;margin:8px 0 0 83px;letter-spacing:1.6px}.hero{margin:30px 0 28px;background:#4558c8;color:white;padding:36px 42px;border-radius:30px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:#d9b8f3;right:-130px;top:-195px;opacity:.9}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,64px);line-height:1.04;font-weight:500;letter-spacing:-.055em;margin:12px 0 20px}.hero h1 em{font-style:normal;color:#e2f586}.hero-bottom{display:flex;justify-content:space-between;gap:15px;font-size:13px}.hero-pill{border:1px solid #ffffff88;border-radius:50px;padding:8px 13px}.search-wrap{position:relative;margin-bottom:18px}.search{width:100%;border:0;background:#f0f1f4;border-radius:40px;padding:20px 24px 20px 56px;font:16px 'DM Sans',sans-serif;outline:none}.search:focus{box-shadow:0 0 0 2px #4558c8}.search-wrap:before{content:'⌕';position:absolute;top:7px;left:19px;font-size:33px;color:#454545}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:32px}.filter{border:0;background:#f0f1f4;border-radius:99px;padding:13px 20px;font:14px 'DM Sans',sans-serif;cursor:pointer;color:#303136}.filter.active{background:#292b2d;color:#fff}.groups{display:flex;flex-direction:column;gap:30px}.group{--accent:#d9b8f3;--surface:#ead8f8}.group[data-type='Horas y planillas']{--accent:#dff37d;--surface:#eff </style></head><body><main class="wrap"><section class="hero" aria-label="LinksPM"><header><span class="logo">PM</span>Oscar Martell</header><p class="tag">TODO EN UN SOLO LUGAR ↗</p></section><aside class="access-alert" role="note"><span aria-hidden="true">⚠</span><p>Los enlaces privados tienen acceso únicamente con el mail institucional.</p></aside><section class="client"><div class="search-wrap"><input class="search" id="q" placeholder="Buscar un enlace..." aria-label="Buscar links"></div><div class="groups" id="links"></div></section><p class="note">Fuente: LinksPM · Los destinos reales mantienen sus propios permisos de acceso.</p></main><script>
const links=[["Configurar doble factor (2FA)","Soporte · Instructivo de autenticación","https://docs.google.com/document/d/18FtqOUSslffur6YyOozrOls0pzO0-0YJyLvjsVp7IJ8/edit?tab=t.0"],["Firmar recibos de haberes","Recibos · Instructivo","https://docs.google.com/document/d/1SbLuRV7HKGUZ209qMcT_h4OnGhn8u_MbYawRvLozPXU/edit?tab=t.0"],["Instructivos del equipo","Organización · Carga de horas, ausencias y People Force","https://docs.google.com/document/d/1RvblgTaV30fv921n99WNnhFQMAOwsH6UGl9qYFuPvIM/edit?tab=t.kldbahcyi6bu"],["Carga de horas en SN","Horas · Instructivos","https://drive.google.com/drive/folders/14hyj3Dew43S3N4oapu9x-9aAKWjzJNW3"],["Carga de horas del equipo","Horas · Planilla","https://docs.google.com/spreadsheets/d/17mFgS5PW0Fght0nZixDvD4ioSTpatwMOGg2Lb5gPfDI/edit"],["Carpeta de horas del equipo","Horas · Archivos por colaborador","https://drive.google.com/drive/folders/1-ocZy6x52z_QVGyIKcW9l4_eQKb9ZLgC"],["People Force","Organización · Acceso","https://nowvertical-es.peopleforce.io/users/sign_in"],["WeAreNow","Beneficios · Portal","http://wearenow-es.com"],["Club de Beneficios","Beneficios · Portal","https://clubdebeneficios.com/"],["Fondos para Meet","Imagen corporativa · Fondos para videollamadas","https://drive.google.com/drive/folders/16IW8RR_D1GaF1w8lRG3jsPDq2-ZaEKtt?usp=drive_link"],["Banners para LinkedIn","Imagen corporativa · Banners para tu perfil","https://nowvertical-es.peopleforce.io/knowledge_base/articles/96846-banners-para-linkedin"]];
const q=document.getElementById('q'),out=document.getElementById('links');
const categories=[{name:'Instructivos',sub:'Documentación y guías para el día a día',items:[0,1,2]},{name:'Horas y planillas',sub:'Registro de horas y herramientas de seguimiento',items:[3,4,5]},{name:'Gestión',sub:'Herramientas de gestión',items:[6]},{name:'Beneficios',sub:'Accesos a plataformas y servicios',items:[7,8]},{name:'Recursos corporativos',sub:'Materiales de imagen para reuniones y perfiles profesionales',items:[9,10]}];

const geometricFigures=[
'<path d="M5 6 28 2 38 15 29 36 11 32 2 19Z"/>',
'<circle cx="20" cy="20" r="17"/>',
'<rect x="4" y="4" width="32" height="32" rx="2"/>',
'<path d="M20 2 39 37H1Z"/>',
'<path d="m20 1 19 19-19 19L1 20Z"/>',
'<path d="m20 2 17 12-6 22H9L3 14Z"/>',
'<path d="m10 3 20 0 10 17-10 17H10L0 20Z"/>',
'<path d="M3 3h34v17H20v17H3Z"/>',

'<path d="M3 20a17 17 0 0 1 34 0Z"/>',
'<path d="M3 3h17a17 17 0 0 1 0 34H3Z"/>',
'<rect x="10" y="2" width="20" height="36" rx="10" transform="rotate(35 20 20)"/>',

'<path d="m20 1 5 12 13 1-10 9 3 15-11-8-11 8 3-15L2 14l13-1Z"/>',
'<path d="m4 4 32 0-12 16 12 16H4l12-16Z"/>',
'<path d="M2 7h23l13 26H15Z"/>',
'<path d="M3 3h34L20 37Z"/>',
'<path fill-rule="evenodd" d="M20 2a18 18 0 1 0 0 36 18 18 0 0 0 0-36m0 9a9 9 0 1 1 0 18 9 9 0 0 1 0-18"/>',
'<path d="M20 2C40 2 40 20 20 38 0 20 0 2 20 2Z"/>',
'<path d="M2 20C2 2 20 2 20 20 20 2 38 2 38 20 38 38 20 38 20 20 20 38 2 38 2 20Z"/>',
'<path d="M2 3h14v34H2Zm22 0h14v34H24Z"/>',
'<path d="m2 3 18 17L2 37Zm20 0 18 17-18 17Z"/>',
'<path d="M2 37V25h12V13h12V1h12v36Z"/>',
'<path d="M2 20 20 2h18L20 20l18 18H20Z"/>',
'<path d="M20 2a18 18 0 0 1 18 18H20v18A18 18 0 0 1 2 20h18Z"/>'
];
for(let i=geometricFigures.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[geometricFigures[i],geometricFigures[j]]=[geometricFigures[j],geometricFigures[i]];}
const figureColors=['#4558c8','#f35e38','#c4dc58','#ad7bc6','#399e91','#de9b48'];
const figureOffset=Math.floor(Math.random()*figureColors.length);
const figureByLink=new Map(links.map((link,i)=>[link,'<span class="shape" aria-hidden="true"><svg viewBox="0 0 40 40" fill="'+figureColors[(i+figureOffset)%figureColors.length]+'">'+geometricFigures[i%geometricFigures.length]+'</svg></span>']));

function render(){const term=q.value.toLowerCase().trim();const groups=categories.map(g=>({...g,items:g.items.map(i=>links[i]).filter(l=>l.join(' ').toLowerCase().includes(term))})).filter(g=>g.items.length);out.innerHTML=groups.map(g=>'<section class="group" data-type="'+g.name+'"><h2 class="group-head"><span class="dot"></span>'+g.name+'<span class="group-count">'+g.items.length+'</span></h2><p class="group-sub">'+g.sub+'</p><div class="links">'+g.items.map(l=>'<a class="link" href="'+l[2]+'" target="_blank" rel="noopener noreferrer">'+figureByLink.get(l)+'<span class="link-copy"><span class="link-title">'+l[0]+'</span><div class="desc">'+l[1]+'</div></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>').join('')+'</div></section>').join('')||'<p class="empty">No se encontraron links.</p>';}
q.addEventListener('input',render);render();
</script></body></html>
