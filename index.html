<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4558c8"><title>LinksPM · Oscar Martell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#4558c8;--lime:#dff37d;--white:#fff;--bg:#f7f8fa;--text:#292f3e;--muted:#737c8d;--line:#e4e7ef}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.layout{max-width:1040px;margin:auto;padding:22px 22px 115px}.hero{background:var(--blue);color:#fff;border-radius:24px;padding:25px 28px;max-width:820px}.topline{display:flex;align-items:center;gap:13px}.logo{background:var(--lime);color:#26312a;border-radius:12px;padding:14px 11px;font-weight:700;font:700 18px 'Space Grotesk',sans-serif}.owner{font:600 22px 'Space Grotesk',sans-serif}.eyebrow{font-size:10px;letter-spacing:.09em;color:#e4e9ff;margin-top:4px}.hero h1{font:700 36px 'Space Grotesk',sans-serif;letter-spacing:-.05em;margin:19px 0 3px}.hero h1 span{color:var(--lime)}.hero p{font-size:12px;color:#e3e8ff;margin:0 0 16px}.searchbox{display:flex;align-items:center;gap:9px;background:#fff;color:#647087;border-radius:12px;padding:0 13px}.searchbox span{font-size:20px}.searchbox input{min-width:0;width:100%;background:none;border:0;padding:13px 0;outline:0;color:#293245;font-size:13px}.notice{display:flex;align-items:center;gap:9px;background:#fff5da;color:#79612c;border-radius:11px;padding:10px 13px;margin:14px 0 21px;max-width:820px;font-size:12px;line-height:1.45}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:21px 0 12px;max-width:820px}.sectionhead h2{font-size:16px;margin:0;font-weight:700}.sectionhead small{font-size:10px;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:820px;gap:9px}.quick a,.quick button{background:#e8edff;border:0;border-radius:12px;min-height:43px;display:flex;align-items:center;text-align:left;gap:9px;padding:10px 12px;color:#2f3a65}.quick a:nth-child(even),.quick button:nth-child(even){background:#eaf5bf}.quick .ico{font-size:16px}.quick .name{min-width:0;flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quick .external{font-size:15px;color:#747d96}.quick a:hover,.quick button:hover{filter:brightness(.97)}.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:820px;align-items:start}.folder{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.folder-btn{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:13px}.folder-btn:hover{background:#f9faff}.foldericon{display:grid;place-items:center;width:37px;height:37px;border-radius:9px;background:var(--folder-color);font-size:18px;flex:none}.foldername{font-weight:700;font-size:13px}.foldercount{font-size:10px;color:#878e9c;margin-top:2px}.chevron{margin-left:auto;font-size:18px;color:#82899c}.folderitems{border-top:1px solid #edf0f5;padding:5px 8px 9px}.item{display:flex;align-items:center;gap:8px;padding:10px 9px;border-radius:8px}.item:hover{background:#f7f8fd}.item .link-icon{color:#8c95a5;font-size:14px}.item a,.item .contact{flex:1;min-width:0;text-align:left;font-size:12px;white-space:normal;line-height:1.4}.item .contact{border:0;background:none;padding:0;color:var(--text)}.item .launch{color:var(--blue);font-size:16px;flex:none}.item .fav{background:none;border:0;color:#bbc0ce;font-size:19px;padding:3px}.item .fav.selected{color:#d69a12}.nothing{font-size:13px;color:#7e8694;padding:18px 0}.nav{display:flex;justify-content:center;gap:4px;max-width:600px;margin:28px 0 0;padding:9px;background:#fff;border:1px solid var(--line);border-radius:17px}.nav button{min-width:0;flex:1;background:none;border:0;color:#888f9d;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 3px;border-radius:10px;font-size:11px}.nav button span{font-size:21px}.nav button.selected{color:var(--blue);background:#e8edff}.nav button:hover{color:var(--blue)}.oscar-dialog{border:0;border-radius:18px;padding:24px;max-width:calc(100% - 30px);box-shadow:0 15px 50px #1a27584a}.oscar-dialog::backdrop{background:#17234266}.oscar-dialog p{font-size:17px;font-weight:700}.oscar-dialog button{border:0;border-radius:18px;padding:10px 17px;background:var(--blue);color:white}
@media(max-width:650px){.layout{max-width:450px;padding:15px 14px 110px}.hero{padding:19px 18px;border-radius:18px}.logo{padding:10px 9px;font-size:15px}.owner{font-size:18px}.hero h1{font-size:30px;margin-top:16px}.hero p{font-size:11px}.notice{padding:9px 11px;margin:12px 0 18px;font-size:11px}.sectionhead{margin:17px 0 10px}.quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick a,.quick button{min-height:40px;padding:9px 10px}.folders{grid-template-columns:1fr;gap:8px}.folder-btn{padding:11px 12px}.nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 26px);max-width:450px;margin:0;box-shadow:0 9px 30px #24355d20;z-index:10}.nav button{font-size:10px;padding:7px 2px}.nav button span{font-size:20px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.hero .hero-description-new{font-size:14px;font-weight:500;line-height:1.5;margin:20px 0 16px;color:#f4f5ff}@media(max-width:650px){.hero .hero-description-new{font-size:12px;margin:16px 0 14px}}</style></head><body><main class="layout"><header class="hero" id="top"><div class="topline"><span class="logo">PM</span><div><div class="owner">Oscar Martell</div><div class="eyebrow">TODO EN UN SOLO LUGAR ↗</div></div></div><p class="hero-description-new">Herramientas, recursos, enlaces útiles para el todo el equipo</p><label class="searchbox"><span>⌕</span><input id="search" type="search" placeholder="Buscar un recurso..." aria-label="Buscar recurso"></label></header><aside class="notice"><span>🔒</span>Los enlaces privados requieren acceso con el mail institucional.</aside><section id="quickSection"><div class="sectionhead"><h2>Accesos rápidos</h2><small id="quickCount"></small></div><div class="quick" id="quick"></div></section><section id="folderSection"><div class="sectionhead"><h2 id="sectionTitle">Mis recursos</h2><small id="resourceCount"></small></div><div class="folders" id="folders"></div></section><nav class="nav" aria-label="Navegación"><button class="selected" data-tab="inicio"><span>⌂</span>Inicio</button><button data-tab="carpetas"><span>▦</span>Carpetas</button><button data-tab="favoritos"><span>☆</span>Favoritos</button><button id="topButton" type="button"><span>↑</span>Ir arriba</button></nav></main><dialog class="oscar-dialog" id="oscar-dialog"><p>Comunicate con Óscar</p><form method="dialog"><button>Aceptar</button></form></dialog><script>
const links=[["📄 Configurar doble Factor Cuenta de Google (2FA)","Soporte · Guía escrita de autenticación","https://docs.google.com/document/d/18FtqOUSslffur6YyOozrOls0pzO0-0YJyLvjsVp7IJ8/edit?tab=t.0"],["📘 Instructivo completo","Organización · Carga de horas, ausencias y People Force","https://docs.google.com/document/d/1RvblgTaV30fv921n99WNnhFQMAOwsH6UGl9qYFuPvIM/edit?tab=t.kldbahcyi6bu"],["📁 Carga de horas en SN","Horas · Instructivos","https://drive.google.com/drive/folders/14hyj3Dew43S3N4oapu9x-9aAKWjzJNW3"],["📊 Carga de horas del equipo","Horas · Planilla","https://docs.google.com/spreadsheets/d/17mFgS5PW0Fght0nZixDvD4ioSTpatwMOGg2Lb5gPfDI/edit"],["📁 Carpeta de horas del equipo","Horas · Archivos por colaborador","https://drive.google.com/drive/folders/1-ocZy6x52z_QVGyIKcW9l4_eQKb9ZLgC"],["🌐 People Force","Organización · Acceso","https://nowvertical-es.peopleforce.io/users/sign_in"],["🌐 WeAreNow","Beneficios · Portal","http://wearenow-es.com"],["🌐 Club de Beneficios","Beneficios · Portal","https://clubdebeneficios.com/"],["📁 Fondos para Meet","Imagen corporativa · Fondos para videollamadas","https://drive.google.com/drive/folders/16IW8RR_D1GaF1w8lRG3jsPDq2-ZaEKtt?usp=drive_link"],["🌐 Banners para LinkedIn","Imagen corporativa · Banners para tu perfil","https://nowvertical-es.peopleforce.io/knowledge_base/articles/96846-banners-para-linkedin"]];
links.push(["🎥 Configurar doble Factor Cuenta de Google (2FA)","Google · Activar y desactivar la verificación en dos pasos","https://youtu.be/PanY1peRHrY?si=jOBQRVg3eh0fqLau&t=36"]);
links.push(["🏖️ Solicitud Vacaciones","Gestión · Consultas","#oscar"],["🔑 Restablecer contraseña","Gestión · Consultas","#oscar"]);
links.push(["📣 Informar ausencia","Gestión · Consultas","#oscar"]);
links.push(["🛠️ Soporte IT","Gestión · Consultas","#oscar"]);

const categories=[{name:'Instructivos',color:'#dff37d',icon:'📘',items:[1,2,10,0]},{name:'Planillas',color:'#dff37d',icon:'📊',items:[3,4]},{name:'Gestión',color:'#bfc9ff',icon:'🗂️',items:[5,11,12,13,14]},{name:'Beneficios',color:'#f7a385',icon:'🎁',items:[6,7]},{name:'Recursos corporativos',color:'#8dd7cc',icon:'🎨',items:[8,9]}];
const quickIds=[1,3,5,14];
const favKey='linkspm-home-favorites-v1';let favorites;try{favorites=new Set(JSON.parse(localStorage.getItem(favKey))||[])}catch{favorites=new Set()}
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const cleanTitle=i=>links[i][0].replace(/^\S+\s+/u,'');
let opened='Instructivos',tab='inicio';
function linkElement(i){const l=links[i],contact=l[2]==='#oscar',title=cleanTitle(i);return contact?`<button type="button" class="contact" data-contact>${escapeHTML(title)}</button>`:`<a href="${escapeHTML(l[2])}" target="_blank" rel="noopener noreferrer">${escapeHTML(title)}</a>`}
function render(){
 const query=$('search').value.trim().toLocaleLowerCase('es');
 const grouped=categories.map(g=>({...g,found:g.items.filter(i=>[links[i][0],links[i][1],g.name].join(' ').toLocaleLowerCase('es').includes(query)&& (tab!=='favoritos'||favorites.has(i)))})).filter(g=>g.found.length);
 $('sectionTitle').textContent=tab==='favoritos'?'Favoritos':'Mis recursos';
 $('resourceCount').textContent=grouped.reduce((n,g)=>n+g.found.length,0)+' recursos';
 $('quickSection').hidden=tab==='favoritos'||!!query;
 $('quickCount').textContent='4 accesos';
 $('quick').innerHTML=quickIds.map(i=>{const l=links[i];return l[2]==='#oscar'?`<button type="button" data-contact><span class="ico">${escapeHTML(l[0].split(' ')[0])}</span><span class="name">${escapeHTML(cleanTitle(i))}</span><span class="external">↗</span></button>`:`<a href="${escapeHTML(l[2])}" target="_blank" rel="noopener noreferrer"><span class="ico">${escapeHTML(l[0].split(' ')[0])}</span><span class="name">${escapeHTML(cleanTitle(i))}</span><span class="external">↗</span></a>`}).join('');
 $('folders').innerHTML=grouped.map(g=>{const open=query||opened===g.name;return `<div class="folder" data-folder="${escapeHTML(g.name)}" style="--folder-color:${g.color}"><button class="folder-btn" data-toggle="${escapeHTML(g.name)}" aria-expanded="${!!open}"><span class="foldericon">${g.icon}</span><span><div class="foldername">${escapeHTML(g.name)}</div><div class="foldercount">${g.found.length} recursos</div></span><span class="chevron">${open?'⌄':'›'}</span></button>${open?`<div class="folderitems">${g.found.map(i=>`<div class="item"><span class="link-icon">↗</span>${linkElement(i)}<button type="button" class="fav ${favorites.has(i)?'selected':''}" data-fav="${i}" aria-label="${favorites.has(i)?'Quitar de favoritos':'Agregar a favoritos'}">${favorites.has(i)?'★':'☆'}</button></div>`).join('')}</div>`:''}</div>`}).join('')||'<div class="nothing">No hay recursos para mostrar.</div>';
 document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.toggle;opened=opened===name?'':name;render()}));
 document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.fav);favorites.has(i)?favorites.delete(i):favorites.add(i);localStorage.setItem(favKey,JSON.stringify([...favorites]));render()}));
 document.querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',()=>document.getElementById('oscar-dialog').showModal()));
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));
}
document.addEventListener('click',e=>{if(!opened)return;if(e.target.closest('.folder')||e.target.closest('#oscar-dialog'))return;opened='';render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;opened=tab==='inicio'?'Instructivos':'';$('search').value='';render();if(tab==='carpetas'||tab==='favoritos')$('folderSection').scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'smooth'})}));
$('topButton').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
$('search').addEventListener('input',render);
render();
</script></body></html>
