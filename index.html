<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Oscar Martell — LinksPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f1e4;color:#171717;font-family:'DM Sans',sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 22px 50px}header{display:flex;align-items:center;gap:12px;font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:-1.5px}.logo{background:#e4e13d;border-radius:16px;padding:14px}.tag{margin:52px 0 22px;color:#174290;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px}.client{background:linear-gradient(145deg,#2551bb 0%,#1768c6 53%,#1194d4 100%);border-radius:30px;padding:28px;margin-top:22px;color:white;box-shadow:0 12px 35px #17429018}.client-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.client-head h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(27px,5vw,42px);letter-spacing:-1.5px;margin:0}.client-head span{font-size:13px;opacity:.88}.search{width:100%;border:1px solid #ffffff66;background:#ffffffed;color:#171717;border-radius:20px;padding:17px 19px;font-family:inherit;font-size:16px;outline-color:#e4e13d}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.link{background:#ffffffed;color:#123b7b;text-decoration:none;padding:23px;border-radius:20px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,background .15s}.link:hover{transform:translateY(-2px);background:white}.link-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.6px;display:flex;justify-content:space-between;gap:8px}.desc{font-size:13px;color:#3f5b81}.empty{grid-column:1/-1;color:white}.note{margin-top:26px;color:#686868;font-size:12px}@media(max-width:620px){.wrap{padding:24px 16px}.client{padding:20px;border-radius:24px}.links{grid-template-columns:1fr}.link{min-height:105px}.tag{margin-top:38px}header{font-size:26px}}
.groups{display:flex;flex-direction:column;gap:24px;margin-top:22px}.group{border-radius:22px;padding:17px;background:#ffffff17;border:1px solid #ffffff35}.group-head{display:flex;align-items:center;gap:10px;margin:0 0 13px;font:700 17px 'Space Grotesk',sans-serif}.group-head .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}.group-count{margin-left:auto;font:500 12px 'DM Sans',sans-serif;opacity:.8}.group .links{margin-top:0}.group .link{border-top:5px solid var(--accent);background:var(--surface);color:#173257}.group .desc{color:#48627b}.group[data-type='Instructivos']{--accent:#86b8ff;--surface:#e8f1ff}.group[data-type='Horas y planillas']{--accent:#65d6c0;--surface:#e2faf3}.group[data-type='Portales y beneficios']{--accent:#ffd16e;--surface:#fff4d9}.group[data-type='Gestión y gastos']{--accent:#e2b4ff;--surface:#f5eaff}.group .link:hover{background:#fff}.group .links .empty{margin:0}</style></head><body><main class="wrap"><header><span class="logo">PM</span>Oscar Martell</header><p class="tag">TODO EN UN SOLO LUGAR ↗</p><section class="client"><div class="client-head"><h1>Links</h1><span>10 accesos</span></div><input class="search" id="q" placeholder="Buscar un link..." aria-label="Buscar links"><div class="groups" id="links"></div></section><p class="note">Fuente: LinksPM · Los destinos reales mantienen sus propios permisos de acceso.</p></main><script>
const links=[["Configurar doble factor (2FA)","Soporte · Instructivo de autenticación","https://docs.google.com/document/d/18FtqOUSslffur6YyOozrOls0pzO0-0YJyLvjsVp7IJ8/edit?tab=t.0"],["Firmar recibos de haberes","Recibos · Instructivo","https://docs.google.com/document/d/1SbLuRV7HKGUZ209qMcT_h4OnGhn8u_MbYawRvLozPXU/edit?tab=t.0"],["Instructivos del equipo","Organización · Carga de horas, ausencias y People Force","https://docs.google.com/document/d/1RvblgTaV30fv921n99WNnhFQMAOwsH6UGl9qYFuPvIM/edit?tab=t.kldbahcyi6bu"],["Carga de horas en ServiceNow","Horas · Instructivos","https://drive.google.com/drive/folders/14hyj3Dew43S3N4oapu9x-9aAKWjzJNW3"],["Carga de horas del equipo","Horas · Planilla","https://docs.google.com/spreadsheets/d/17mFgS5PW0Fght0nZixDvD4ioSTpatwMOGg2Lb5gPfDI/edit"],["Carpeta de horas del equipo","Horas · Archivos por colaborador","https://drive.google.com/drive/folders/1-ocZy6x52z_QVGyIKcW9l4_eQKb9ZLgC"],["Modelo de viáticos y gastos","Planilla · Rendición","https://docs.google.com/spreadsheets/d/1SQLTx06B_L1j7owMODNOtWmvxuJc9zwc/edit?gid=1757086217"],["People Force","Organización · Acceso","https://nowvertical-es.peopleforce.io/users/sign_in"],["WeAreNow","Beneficios · Portal","http://wearenow-es.com"],["Club de Beneficios","Beneficios · Portal","https://clubdebeneficios.com/"]];
const q=document.getElementById('q'),out=document.getElementById('links');
const categories=[{name:'Instructivos',items:[0,1,2,3]},{name:'Horas y planillas',items:[4,5]},{name:'Gestión y gastos',items:[6]},{name:'Portales y beneficios',items:[7,8,9]}];
function render(){const term=q.value.toLowerCase().trim();const groups=categories.map(g=>({...g,items:g.items.map(i=>links[i]).filter(l=>l.join(' ').toLowerCase().includes(term))})).filter(g=>g.items.length);out.innerHTML=groups.map(g=>'<section class="group" data-type="'+g.name+'"><h2 class="group-head"><span class="dot"></span>'+g.name+'<span class="group-count">'+g.items.length+' accesos</span></h2><div class="links">'+g.items.map(l=>'<a class="link" href="'+l[2]+'" target="_blank" rel="noopener noreferrer"><div class="link-title"><span>'+l[0]+'</span><span>↗</span></div><span class="desc">'+l[1]+'</span></a>').join('')+'</div></section>').join('')||'<p class="empty">No se encontraron links.</p>';}
q.addEventListener('input',render);render();
</script></body></html>
