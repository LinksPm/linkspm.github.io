<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Oscar Martell — LinksPM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e4;color:#171717;font-family:'DM Sans',Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 22px}header{display:flex;align-items:center;gap:12px;font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:-1.5px}.logo{background:#e4e13d;border-radius:16px;padding:14px}.tag{font-family:'Space Grotesk',sans-serif;margin:65px 0 20px;color:#174290;font-size:15px;font-weight:800;letter-spacing:2px}input{width:100%;border:0;background:white;border-radius:32px;padding:20px;font-size:17px;outline-color:#174290}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.space{min-height:220px;border:0;border-radius:26px;text-align:left;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:#171717}.space strong{font-family:'Space Grotesk',sans-serif;font-size:29px;letter-spacing:-1.2px;font-weight:700}.space small{font-size:13px}.arrow{align-self:end;background:#171717;color:white;padding:10px;border-radius:50%;font-size:20px}.yellow{background:linear-gradient(145deg,#2551bb 0%,#1768c6 53%,#1194d4 100%);color:#fff}.yellow .arrow{background:#fff;color:#174290}.blue{background:#b5d4ed}.orange{background:#f6a552}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.link{display:block;padding:22px;background:white;border-radius:18px;text-decoration:none;color:#171717}.link b{font-family:'Space Grotesk',sans-serif;display:block;margin-bottom:8px}.link span{color:#666;font-size:13px}#title{font-family:'Space Grotesk',sans-serif;font-size:34px;letter-spacing:-1.5px}.back{border:0;background:transparent;padding:20px 0;cursor:pointer;font-size:16px}.hidden{display:none}.note{margin-top:35px;color:#666;font-size:12px}@media(max-width:700px){.grid,.links{grid-template-columns:1fr}.space{min-height:150px}.tag{margin-top:42px}}</style></head><body><main class="wrap"><header><span class="logo">PM</span>Oscar Martell</header><p class="tag">TODO EN UN SOLO LUGAR ↗</p><input id="q" placeholder="Buscar recursos..." aria-label="Buscar recursos"><section id="home"><div class="grid" id="spaces"></div></section><section id="detail" class="hidden"><button class="back" onclick="back()">← Volver a los espacios</button><h2 id="title"></h2><div class="links" id="links"></div></section><p class="note">Versión de prueba · Clientes y enlaces ficticios · Los documentos reales conservan sus permisos institucionales.</p></main><script>const data=[{name:"Espacio 01",color:"yellow",links:[["Tablero de tareas","Organización del trabajo"],["Documentación","Guías y procedimientos"],["Calendario","Fechas importantes"],["Plantillas","Recursos de trabajo"]]},{name:"Espacio 02",color:"blue",links:[["Seguimiento","Estado de actividades"],["Archivos","Material del equipo"],["Reportes","Indicadores"],["Reuniones","Notas y acuerdos"]]},{name:"Espacio 03",color:"orange",links:[["Planificación","Cronograma"],["Solicitudes","Pedidos del equipo"],["Recursos","Material de apoyo"],["Contactos","Canales de comunicación"]]}];let selected=-1;const q=document.getElementById("q");function render(){const term=q.value.toLowerCase();if(selected<0){document.getElementById("home").classList.remove("hidden");document.getElementById("detail").classList.add("hidden");document.getElementById("spaces").innerHTML=data.map((s,i)=>({s,i})).filter(x=>x.s.name.toLowerCase().includes(term)||x.s.links.some(l=>l.join(" ").toLowerCase().includes(term))).map(({s,i})=>'<button class="space '+s.color+'" onclick="openSpace('+i+')"><span class="arrow">↗</span><div><strong>'+s.name+'</strong><br><small>'+s.links.length+' recursos disponibles</small></div></button>').join("")||"<p>No se encontraron espacios.</p>"}else{document.getElementById("home").classList.add("hidden");document.getElementById("detail").classList.remove("hidden");let s=data[selected];document.getElementById("title").textContent=s.name;document.getElementById("links").innerHTML=s.links.filter(l=>l.join(" ").toLowerCase().includes(term)).map((l,i)=>'<a class="link" href="https://example.com/" target="_blank" rel="noopener"><b>'+l[0]+' ↗</b><span>'+l[1]+'</span></a>').join("")||"<p>No se encontraron enlaces.</p>"}}function openSpace(i){selected=i;q.value="";render()}function back(){selected=-1;q.value="";render()}q.addEventListener("input",render);render()</script></body></html>
