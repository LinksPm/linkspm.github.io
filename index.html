<style>

;gap:9px;padding:10px 12px;color:#2f3a65}.quick a:nth-child(even),.quick button:nth-child(even){background:#eaf5bf}.quick .ico{font-size:16px}.quick .name{min-width:0;flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quick .external{font-size:15px;color:#747d96}.quick a:hover,.quick button:hover{filter:brightness(.97)}.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:820px;align-items:start}.folder{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.folder-btn{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:13px}.folder-btn:hover{background:#f9faff}.foldericon{display:grid;place-items:center;width:37px;height:37px;border-radius:9px;background:var(--folder-color);font-size:18px;flex:none}.foldername{font-weight:700;font-size:13px}.foldercount{font-size:10px;color:#878e9c;margin-top:2px}.chevron{margin-left:auto;font-size:18px;color:#82899c}.folderitems{border-top:1px solid #edf0f5;padding:5px 8px 9px}.item{display:flex;align-items:center;gap:8px;padding:10px 9px;border-radius:8px}.item:hover{background:#f7f8fd}.item .link-icon{color:#8c95a5;font-size:14px}.item a,.item .contact{flex:1;min-width:0;text-align:left;font-size:12px;white-space:normal;line-height:1.4}.item .contact{border:0;background:none;padding:0;color:var(--text)}.item .launch{color:var(--blue);font-size:16px;flex:none}.item .fav{background:none;border:0;color:#bbc0ce;font-size:19px;padding:3px}.item .fav.selected{color:#d69a12}.nothing{font-size:13px;color:#7e8694;padding:18px 0}.nav{display:flex;justify-content:center;gap:4px;max-width:600px;margin:28px 0 0;padding:9px;background:#fff;border:1px solid var(--line);border-radius:17px}.nav button{min-width:0;flex:1;background:none;border:0;color:#888f9d;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 3px;border-radius:10px;font-size:11px}.nav button span{font-size:21px}.nav button.selected{color:var(--blue);background:#e8edff}.nav button:hover{color:var(--blue)}.oscar-dialog{border:0;border-radius:18px;padding:24px;max-width:calc(100% - 30px);box-shadow:0 15px 50px #1a27584a}.oscar-dialog::backdrop{background:#17234266}.oscar-dialog p{font-size:17px;font-weight:700}.oscar-dialog button{border:0;border-radius:18px;padding:10px 17px;background:var(--blue);color:white}

.hero .hero-description-new{font-size:14px;font-weight:500;line-height:1.5;margin:20px 0 16px;color:#f4f5ff}@media(max-width:650px){.hero .hero-description-new{font-size:12px;margin:16px 0 14px}}.consult-intro{font-size:12px;color:var(--muted);margin:5px 0 0}.consult-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:820px;gap:9px}.consult-card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.consult-toggle{display:flex;align-items:center;text-align:left;gap:12px;background:none;border:0;width:100%;padding:15px 13px}.consult-toggle:hover{background:#f9faff}.consult-icon{display:grid;place-items:center;width:37px;height:37px;border-radius:9px;background:#e8edff;flex:none;font-size:18px}.consult-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}.consult-copy strong{font-size:13px}.consult-copy small{font-size:11px;line-height:1.4;color:#7a8391}.consult-detail{padding:12px 15px 15px;border-top:1px solid #e4e7ef}.consult-detail p{font-size:12px;line-height:1.55;color:#4f5869;margin:0 0 10px}.consult-help{border-radius:9px;background:#fff3d5;color:#80632b;padding:10px;font-size:11px}@media(max-width:650px){.consult-list{grid-template-columns:1fr}.consult-toggle{padding:12px}} .lucide{display:block;flex-shrink:0}.searchbox .search-icon{display:flex;align-items:center}.notice span{display:flex;align-items:center}.foldericon .lucide,.consult-icon .lucide{width:20px;height:20px;color:#303b4b}.nav button>.lucide{width:22px;height:22px;margin-bottom:2px}.quick .ico,.quick .external,.folder .chevron,.consult-card .chevron,.item .link-icon{display:flex;align-items:center}.quick .ico .lucide{width:18px;height:18px}.quick .external .lucide,.folder .chevron .lucide,.consult-card .chevron .lucide{width:17px;height:17px}.item .link-icon .lucide{width:15px;height:15px}.item .fav{display:grid;place-items:center;padding:6px}.item .fav .lucide{width:18px;height:18px}.item .fav.selected .lucide{fill:#d69a12;stroke:#d69a12}</style></head><body><main class="layout"><header class="hero" id="top"><div class="topline"><span class="logo">PM</span><div><div class="owner">Oscar Martell</div><div class="eyebrow">TODO EN UN SOLO LUGAR ↗</div></div></div><p class="hero-description-new">Herramientas, recursos, enlaces útiles para el todo el equipo</p><label class="searchbox"><span class="search-icon"><svg class="lucide" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input id="search" type="search" placeholder="Buscar un recurso..." aria-label="Buscar recurso"></label></header><aside class="notice"><span><svg class="lucide" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>Los enlaces privados requieren acceso con el mail institucional.</aside><section id="quickSection"><div class="sectionhead"><h2>Accesos rápidos</h2><small id="quickCount"></small></div><div class="quick" id="quick"></div></section><section id="consultSection" hidden><div class="sectionhead"><div><h2>¿En qué necesitás ayuda?</h2><p class="consult-intro">Elegí el motivo de tu consulta.</p></div></div><div class="consult-list" id="consultList"></div></section><section id="folderSection"><div class="sectionhead"><h2 id="sectionTitle">Mis recursos</h2><small id="resourceCount"></small></div><div class="folders" id="folders"></div></section><nav class="nav" aria-label="Navegación"><button class="selected" data-tab="inicio"><svg class="lucide" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg>Inicio</button><button data-tab="consultas"><svg class="lucide" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>Consultas</button><button data-tab="favoritos"><svg class="lucide" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.3L22 9.3l-5 4.9 1.2 6.8L12 17.8 5.8 21 7 14.2 2 9.3l6.9-1z"/></svg>Favoritos</button><button id="topButton" type="button"><svg class="lucide" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19 0-14m-7 7 7-7 7 7"/></svg>Ir arriba</button></nav></main><dialog class="oscar-dialog" id="oscar-dialog"><p>Comunicate con Óscar</p><form method="dialog"><button>Aceptar</button></form></dialog><script>
const links=[["📄 Configurar doble Factor Cuenta de Google (2FA)","Soporte · Guía escrita de autenticación","https://docs.google.com/document/d/18FtqOUSslffur6YyOozrOls0pzO0-0YJyLvjsVp7IJ8/edit?tab=t.0"],["📘 Instructivo completo","Organización · Carga de horas, ausencias y People Force","https://docs.google.com/document/d/1RvblgTaV30fv921n99WNnhFQMAOwsH6UGl9qYFuPvIM/edit?tab=t.kldbahcyi6bu"],["📁 Carga de horas en SN","Horas · Instructivos","https://drive.google.com/drive/folders/14hyj3Dew43S3N4oapu9x-9aAKWjzJNW3"],["📊 Carga de horas del equipo","Horas · Planilla","https://docs.google.com/spreadsheets/d/17mFgS5PW0Fght0nZixDvD4ioSTpatwMOGg2Lb5gPfDI/edit"],["📁 Carpeta de horas del equipo","Horas · Archivos por colaborador","https://drive.google.com/drive/folders/1-ocZy6x52z_QVGyIKcW9l4_eQKb9ZLgC"],["🌐 People Force","Organización · Acceso","https://nowvertical-es.peopleforce.io/users/sign_in"],["🌐 WeAreNow","Beneficios · Portal","http://wearenow-es.com"],["🌐 Club de Beneficios","Beneficios · Portal","https://clubdebeneficios.com/"],["📁 Fondos para Meet","Imagen corporativa · Fondos para videollamadas","https://drive.google.com/drive/folders/16IW8RR_D1GaF1w8lRG3jsPDq2-ZaEKtt?usp=drive_link"],["🌐 Banners para LinkedIn","Imagen corporativa · Banners para tu perfil","https://nowvertical-es.peopleforce.io/knowledge_base/articles/96846-banners-para-linkedin"]];
links.push(["🎥 Configurar doble Factor Cuenta de Google (2FA)","Google · Activar y desactivar la verificación en dos pasos","https://youtu.be/PanY1peRHrY?si=jOBQRVg3eh0fqLau&t=36"]);
links.push(["🏖️ Solicitud Vacaciones","Gestión · Consultas","#oscar"],["🔑 Restablecer contraseña","Gestión · Consultas","#oscar"]);
links.push(["📣 Informar ausencia","Gestión · Consultas","#oscar"]);
links.push(["🛠️ Soporte IT","Gestión · Consultas","#oscar"]);

const iconPaths={"search":"<circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.35-4.35\"/>","lock":"<rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/>","home":"<path d=\"m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z\"/><path d=\"M9 21v-8h6v8\"/>","message":"<path d=\"M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z\"/><path d=\"M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3\"/><path d=\"M12 16h.01\"/>","star":"<path d=\"m12 2 3.1 6.3L22 9.3l-5 4.9 1.2 6.8L12 17.8 5.8 21 7 14.2 2 9.3l6.9-1z\"/>","up":"<path d=\"m12 19 0-14m-7 7 7-7 7 7\"/>","book":"<path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/><path d=\"M9 7h6m-6 4h6\"/>","sheet":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M9 3v18M9 15h12\"/>","briefcase":"<rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M2 12h20\"/>","gift":"<rect x=\"3\" y=\"8\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M12 8v13M3 12h18M3 8h18\"/><path d=\"M12 8c-4 0-7-1-7-4 0-3 7-2 7 4zm0 0c4 0 7-1 7-4 0-3-7-2-7 4z\"/>","panels":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M9 9v12\"/>","calendar":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M16 3v4M8 3v4M3 11h18M8 15h3m-3 3h6\"/>","clock":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l4 2\"/>","key":"<circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"m12 11 9-9 2 2-2 2 1 1-3 3-2-2-3 3\"/>","headset":"<path d=\"M3 14v-3a9 9 0 0 1 18 0v3\"/><rect x=\"2\" y=\"13\" width=\"4\" height=\"7\" rx=\"2\"/><rect x=\"18\" y=\"13\" width=\"4\" height=\"7\" rx=\"2\"/><path d=\"M20 20c-1 2-3 2-5 2h-3\"/>","link":"<path d=\"M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7\"/><path d=\"M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7\"/>","external":"<path d=\"M7 17 17 7M7 7h10v10\"/>","chevronRight":"<path d=\"m9 18 6-6-6-6\"/>","chevronDown":"<path d=\"m6 9 6 6 6-6\"/>","users":"<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/>","folder":"<path d=\"M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/>","video":"<rect x=\"2\" y=\"5\" width=\"15\" height=\"14\" rx=\"2\"/><path d=\"m17 10 5-3v10l-5-3\"/>","globe":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18\"/>","image":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/><path d=\"m21 15-5-5L5 21\"/>"};
function ic(name,cls=''){return '<svg class="lucide '+cls+'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(iconPaths[name]||iconPaths.link)+'</svg>'}
const linkIcons=['book','book','folder','sheet','folder','users','globe','gift','image','panels','video','calendar','key','clock','headset'];
const categories=[{name:'Instructivos',color:'#dff37d',icon:'book',items:[1,2,10,0]},{name:'Planillas',color:'#dff37d',icon:'sheet',items:[3,4]},{name:'Gestión',color:'#bfc9ff',icon:'briefcase',items:[5]},{name:'Beneficios',color:'#f7a385',icon:'gift',items:[6,7]},{name:'Recursos corporativos',color:'#8dd7cc',icon:'panels',items:[8,9]}];
const quickIds=[1,3,5,4];
const favKey='linkspm-home-favorites-v1';let favorites;try{favorites=new Set(JSON.parse(localStorage.getItem(favKey))||[])}catch{favorites=new Set()}
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const cleanTitle=i=>links[i][0].replace(/^\S+\s+/u,'');
let opened='Gestión',tab='inicio';
function linkElement(i){const l=links[i],contact=l[2]==='#oscar',title=cleanTitle(i);return contact?`<button type="button" class="contact" data-contact>${escapeHTML(title)}</button>`:`<a href="${escapeHTML(l[2])}" target="_blank" rel="noopener noreferrer">${escapeHTML(title)}</a>`}
const consultations=[{id:11,icon:'calendar',title:'Solicitar vacaciones',desc:'Consultá cómo gestionar tus días de vacaciones.',detail:'Para solicitar vacaciones, comunicate con Óscar indicando las fechas que necesitás.'},{id:13,icon:'clock',title:'Informar una ausencia',desc:'Avisá si no vas a estar disponible.',detail:'Informá las fechas u horas de ausencia y, cuando corresponda, el motivo.'},{id:12,icon:'key',title:'Restablecer contraseña',desc:'Pedí ayuda para recuperar tu acceso.',detail:'Comunicate con Óscar indicando qué herramienta necesitás recuperar. No compartas tu contraseña.'},{id:14,icon:'headset',title:'Soporte IT',desc:'Consultá por problemas técnicos.',detail:'Describí el problema y la herramienta afectada para orientar tu consulta.'}];
let expandedConsult=null;
function renderConsultations(){
 $('consultList').innerHTML=consultations.map(c=>`<div class="consult-card"><button type="button" class="consult-toggle" data-consult="${c.id}" aria-expanded="${expandedConsult===c.id}"><span class="consult-icon">${ic(c.icon)}</span><span class="consult-copy"><strong>${escapeHTML(c.title)}</strong><small>${escapeHTML(c.desc)}</small></span><span class="chevron">${ic(expandedConsult===c.id?'chevronDown':'chevronRight')}</span></button>${expandedConsult===c.id?`<div class="consult-detail"><p>${escapeHTML(c.detail)}</p><div class="consult-help">Para continuar, comunicate con Óscar.</div></div>`:''}</div>`).join('');
 document.querySelectorAll('[data-consult]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.consult);expandedConsult=expandedConsult===id?null:id;renderConsultations()}));
}
function render(){
 const query=$('search').value.trim().toLocaleLowerCase('es');
 const grouped=categories.map(g=>({...g,found:g.items.filter(i=>[links[i][0],links[i][1],g.name].join(' ').toLocaleLowerCase('es').includes(query)&& (tab!=='favoritos'||favorites.has(i)))})).filter(g=>g.found.length);
 $('consultSection').hidden=tab!=='consultas';
 $('folderSection').hidden=tab==='consultas';
 $('sectionTitle').textContent=tab==='favoritos'?'Favoritos':'Mis recursos';
 renderConsultations();
 $('resourceCount').textContent=grouped.reduce((n,g)=>n+g.found.length,0)+' recursos';
 $('quickSection').hidden=tab!=='inicio'||!!query;
 $('quickCount').textContent='4 accesos';
 $('quick').innerHTML=quickIds.map(i=>{const l=links[i];return l[2]==='#oscar'?`<button type="button" data-contact><span class="ico">${ic(linkIcons[i])}</span><span class="name">${escapeHTML(cleanTitle(i))}</span><span class="external">${ic('external')}</span></button>`:`<a href="${escapeHTML(l[2])}" target="_blank" rel="noopener noreferrer"><span class="ico">${ic(linkIcons[i])}</span><span class="name">${escapeHTML(cleanTitle(i))}</span><span class="external">${ic('external')}</span></a>`}).join('');
 $('folders').innerHTML=grouped.map(g=>{const open=query||opened===g.name;return `<div class="folder" data-folder="${escapeHTML(g.name)}" style="--folder-color:${g.color}"><button class="folder-btn" data-toggle="${escapeHTML(g.name)}" aria-expanded="${!!open}"><span class="foldericon">${ic(g.icon)}</span><span><div class="foldername">${escapeHTML(g.name)}</div><div class="foldercount">${g.found.length} recursos</div></span><span class="chevron">${ic(open?'chevronDown':'chevronRight')}</span></button>${open?`<div class="folderitems">${g.found.map(i=>`<div class="item"><span class="link-icon">${ic('link')}</span>${linkElement(i)}<button type="button" class="fav ${favorites.has(i)?'selected':''}" data-fav="${i}" aria-label="${favorites.has(i)?'Quitar de favoritos':'Agregar a favoritos'}">${ic('star')}</button></div>`).join('')}</div>`:''}</div>`}).join('')||'<div class="nothing">No hay recursos para mostrar.</div>';
 document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.toggle;opened=opened===name?'':name;render()}));
 document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.fav);favorites.has(i)?favorites.delete(i):favorites.add(i);localStorage.setItem(favKey,JSON.stringify([...favorites]));render()}));
 document.querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',()=>document.getElementById('oscar-dialog').showModal()));
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));
}
document.addEventListener('click',e=>{if(!opened)return;if(e.target.closest('.folder')||e.target.closest('#oscar-dialog'))return;opened='';render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;opened=tab==='inicio'?'Gestión':'';$('search').value='';expandedConsult=null;render();if(tab==='consultas')$('consultSection').scrollIntoView({behavior:'smooth',block:'start'});else if(tab==='favoritos')$('folderSection').scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'smooth'})}));
$('topButton').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
$('search').addEventListener('input',()=>{if(tab==='consultas')tab='inicio';render()});
render();
</script></body></html>
