<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Oscar Martell — LinksPM</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2217%22%20fill%3D%22%23dff37d%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#292b2d;font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:1450px;margin:auto;padding:30px 38px 70px}header{display:flex;align-items:center;gap:16px;font-size:clamp(22px,3vw,34px);font-weight:700;letter-spacing:-1.5px}.logo{display:grid;place-items:center;background:#dff37d;width:66px;height:66px;border-radius:18px;color:#222;font-size:27px;letter-spacing:-2px}.tag{font-size:12px;color:#858585;margin:8px 0 0 83px;letter-spacing:1.6px}.hero{margin:30px 0 28px;background:#4558c8;color:white;padding:36px 42px;border-radius:30px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:#d9b8f3;right:-130px;top:-195px;opacity:.9}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,64px);line-height:1.04;font-weight:500;letter-spacing:-.055em;margin:12px 0 20px}.hero h1 em{font-style:normal;color:#e2f586}.hero-bottom{display:flex;justify-content:space-between;gap:15px;font-size:13px}.hero-pill{border:1px solid #ffffff88;border-radius:50px;padding:8px 13px}.search-wrap{position:relative;margin-bottom:18px}.search{width:100%;border:0;background:#f0f1f4;border-radius:40px;padding:20px 24px 20px 56px;font:16px 'DM Sans',sans-serif;outline:none}.search:focus{box-shadow:0 0 0 2px #4558c8}.search-wrap:before{content:'⌕';position:absolute;top:7px;left:19px;font-size:33px;color:#454545}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:32px}.filter{border:0;background:#f0f1f4;border-radius:99px;padding:13px 20px;font:14px 'DM Sans',sans-serif;cursor:pointer;color:#303136}.filter.active{background:#292b2d;color:#fff}.groups{display:flex;flex-direction:column;gap:30px}.group{--accent:#d9b8f3;--surface:#ead8f8}.group[data-type='Horas y planillas']{--accent:#dff37d;--surface:#eff9c9}.group[data-type='Gestión']{--accent:#4558c8;--surface:#e2edfc}.group[data-type='Beneficios']{--accent:#f35e38;--surface:#ffe7d7}.group-head{display:flex;align-items:center;gap:12px;font-size:23px;letter-spacing:-.7px;margin:0 0 8px;font-weight:600}.dot{width:15px;height:15px;border-radius:50%;background:var(--accent)}.group-count{margin-left:auto;background:#f1f2f4;border-radius:50px;padding:6px 13px;font-size:13px;letter-spacing:0}.group-sub{color:#777e8a;font-size:14px;margin:0 0 15px 27px}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.link{min-height:104px;border-radius:18px;background:var(--surface);color:#25272b;text-decoration:none;padding:15px 18px;display:flex;align-items:center;gap:12px;position:relative;transition:transform .18s}.link:hover{transform:translateY(-3px)}.link-copy{min-width:0;flex:1}.link-title{font-size:18px;font-weight:600;line-height:1.2;letter-spacing:-.5px}.desc{font-size:12px;color:#656b75;margin-top:7px;line-height:1.4}.arrow{display:grid;place-items:center;align-self:center;width:32px;height:32px;border-radius:50%;background:transparent;color:#3e4356;flex:none;transition:background .18s,transform .18s}.arrow svg{display:block;width:20px;height:20px}.link:hover .arrow{background:#ffffff66;transform:translateX(2px)}.empty{color:#777}.note{margin-top:48px;border-top:1px solid #ddd;padding-top:15px;font-size:11px;color:#999}@media(max-width:650px){.wrap{padding:18px 16px 45px}.logo{width:50px;height:50px;font-size:21px}header{font-size:24px}.tag{margin-left:0}.hero{padding:27px 23px;min-height:220px}.hero h1{font-size:39px}.hero-bottom{flex-wrap:wrap}.links{grid-template-columns:1fr}.link{min-height:88px}.filters{gap:6px}.filter{padding:10px 14px;font-size:12px}}
.hero{margin:0 0 20px;min-height:0;display:block;padding:32px 38px}.hero header,.hero .tag{position:relative;z-index:1}.hero .tag{color:#eef0ff;margin-top:12px;line-height:1.5}.access-alert{display:flex;align-items:center;gap:12px;background:#fff8e7;border:1px solid #ecdaaa;border-radius:16px;padding:14px 18px;margin:0 0 24px;color:#6a5117;font-size:14px;line-height:1.5}.access-alert>span{font-size:22px;flex:none}.access-alert p{margin:0}@media(max-width:650px){.hero{padding:24px 22px}.hero .tag{margin-left:0;letter-spacing:1px;font-size:11px}.hero:after{right:-220px;top:-225px}.access-alert{align-items:flex-start;font-size:13px;padding:12px 14px}}
.group[data-type='Recursos corporativos']{--accent:#5aada3;--surface:#ddf2ed}
.link-title{display:flex;align-items:flex-start;gap:5mm;font-family:'Space Grotesk','DM Sans',sans-serif;font-size:19px;font-weight:600;line-height:1.3;letter-spacing:-.35px}.item-emoji{flex:none;line-height:1.3;font-size:22px}.desc{margin-left:calc(22px + 5mm)}header,.group-head{font-family:'Space Grotesk','DM Sans',sans-serif}.link-title>span:last-child{min-width:0;overflow-wrap:anywhere}button.link{border:0;font:inherit;text-align:left;width:100%;cursor:pointer}.oscar-dialog{border:0;border-radius:24px;padding:32px;max-width:calc(100% - 32px);color:#292b2d;box-shadow:0 20px 70px #17234233}.oscar-dialog::backdrop{background:#17234266}.oscar-dialog p{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 24px}.oscar-dialog button{border:0;border-radius:30px;background:#4558c8;color:white;padding:12px 24px;font:inherit;cursor:pointer}</style></head><body><main class="wrap"><section class="hero" aria-label="LinksPM"><header><span class="logo">PM</span>Oscar Martell</header><p class="tag">TODO EN UN SOLO LUGAR ↗</p></section><aside class="access-alert" role="note"><span aria-hidden="true">⚠</span><p>Los enlaces privados tienen acceso únicamente con el mail institucional.</p></aside><section class="client"><div class="search-wrap"><input class="search" id="q" placeholder="Buscar un enlace..." aria-label="Buscar links"></div><div class="groups" id="links"></div></section><p class="note">Fuente: LinksPM · Los destinos reales mantienen sus propios permisos de acceso.</p></main><dialog id="oscar-dialog" class="oscar-dialog" aria-labelledby="oscar-message"><p id="oscar-message">Comunicate con Óscar</p><form method="dialog"><button>Cerrar</button></form></dialog><script>
const links=[["📄 Configurar doble Factor Cuenta de Google (2FA)","Soporte · Guía escrita de autenticación","https://docs.google.com/document/d/18FtqOUSslffur6YyOozrOls0pzO0-0YJyLvjsVp7IJ8/edit?tab=t.0"],["📄 Firmar recibos de haberes","Recibos · Instructivo","https://docs.google.com/document/d/1SbLuRV7HKGUZ209qMcT_h4OnGhn8u_MbYawRvLozPXU/edit?tab=t.0"],["📄 Instructivos del equipo","Organización · Carga de horas, ausencias y People Force","https://docs.google.com/document/d/1RvblgTaV30fv921n99WNnhFQMAOwsH6UGl9qYFuPvIM/edit?tab=t.kldbahcyi6bu"],["📁 Carga de horas en SN","Horas · Instructivos","https://drive.google.com/drive/folders/14hyj3Dew43S3N4oapu9x-9aAKWjzJNW3"],["📊 Carga de horas del equipo","Horas · Planilla","https://docs.google.com/spreadsheets/d/17mFgS5PW0Fght0nZixDvD4ioSTpatwMOGg2Lb5gPfDI/edit"],["📁 Carpeta de horas del equipo","Horas · Archivos por colaborador","https://drive.google.com/drive/folders/1-ocZy6x52z_QVGyIKcW9l4_eQKb9ZLgC"],["🌐 People Force","Organización · Acceso","https://nowvertical-es.peopleforce.io/users/sign_in"],["🌐 WeAreNow","Beneficios · Portal","http://wearenow-es.com"],["🌐 Club de Beneficios","Beneficios · Portal","https://clubdebeneficios.com/"],["📁 Fondos para Meet","Imagen corporativa · Fondos para videollamadas","https://drive.google.com/drive/folders/16IW8RR_D1GaF1w8lRG3jsPDq2-ZaEKtt?usp=drive_link"],["🌐 Banners para LinkedIn","Imagen corporativa · Banners para tu perfil","https://nowvertical-es.peopleforce.io/knowledge_base/articles/96846-banners-para-linkedin"]];
links.push(["🎥 Configurar doble Factor Cuenta de Google (2FA)","Google · Activar y desactivar la verificación en dos pasos","https://youtu.be/PanY1peRHrY?si=jOBQRVg3eh0fqLau&t=36"]);
links.push(["🏖️ Solicitud de vacaciones","Gestión · Consultas","#oscar"],["🔑 Restablecimiento de contraseña","Gestión · Consultas","#oscar"]);
links.push([["📣 Informar ausencia","Gestión · Consultas","#oscar"]);
const q=document.getElementById('q'),out=document.getElementById('links');
const categories=[{name:'Instructivos',sub:'Documentación, guías y herramientas para el día a día',items:[11,0,1,2,3,4,5]},{name:'Gestión',sub:'Herramientas de gestión',items:[6,12,13,14,15]},{name:'Beneficios',sub:'Accesos a plataformas y servicios',items:[7,8]},{name:'Recursos corporativos',sub:'Materiales de imagen para reuniones y perfiles profesionales',items:[9,10]}];

function render(){const term=q.value.toLowerCase().trim();const groups=categories.map(g=>({...g,items:g.items.map(i=>links[i]).filter(l=>l.join(' ').toLowerCase().includes(term))})).filter(g=>g.items.length);out.innerHTML=groups.map(g=>'<section class="group" data-type="'+g.name+'"><h2 class="group-head"><span class="dot"></span>'+g.name+'<span class="group-count">'+g.items.length+'</span></h2><div class="links">'+g.items.map(l=>(l[2]==='#oscar'?'<button type="button" class="link contact-oscar">':'<a class="link" href="'+l[2]+'" target="_blank" rel="noopener noreferrer">')+'<span class="link-copy"><span class="link-title"><span class="item-emoji" aria-hidden="true">'+l[0].split(" ")[0]+'</span><span>'+l[0].slice(l[0].indexOf(" ")+1)+'</span></span></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>'+(l[2]==='#oscar'?'</button>':'</a>')).join('')+'</div></section>').join('')||'<p class="empty">No se encontraron links.</p>';}
out.addEventListener('click',event=>{if(event.target.closest('.contact-oscar'))document.getElementById('oscar-dialog').showModal();});
q.addEventListener('input',render);render();
</script></body></html>
