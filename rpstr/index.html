const KEY='pm-oscar-link-repo-v1';let entries;try{const saved=JSON.parse(localStorage.getItem(KEY));entries=Array.isArray(saved)?saved:INITIAL}catch{entries=INITIAL}// Acorta títulos existentes guardados en este navegador sin modificar nombres personalizados.
const SHORT_NAMES={"src5":"Licencias","src6":"Periodos","src8":"Carga horas","src9":"Perfiles y Tarifas","src10":"Carpeta facturacion","src20":"Horas para Payroll y HRBP","src24":"Forecast para facturar","src26":"Forecast - Novedades","src35":"Semáforo de satisfacción","srcE24":"Tablero comparativo","srcF24":"Perfiles vs. nómina"};
const OLD_NAMES={"src5":"EU - Licencias YPF - Team Oscar Martell","src6":"EU - PERIODOS YPF Todo 2026 - Team Oscar Martell","src8":"CARGA HORAS YPF - EQUIPO COMPLETO","src9":"EU - YPF - Perfiles y Tarifas NowVertical desde 04-2026","src10":"Carpeta de facturación 2026","src20":"YPF - Horas DAIA para Payroll y HRBP","src24":"Forecast para Facturar - Team Eze","src26":"Forecast - Novedades","src35":"Juli_Semáforo de satisfacción_Ajustes25","srcE24":"Tablero comparativo · Looker Studio","srcF24":"Comparativo de perfiles activos vs nómina"};
const PREVIOUS_NAMES={"src5":"Licencias","src6":"Períodos","src8":"Carga de horas","src9":"Perfiles y tarifas","src10":"Facturación","src20":"Horas DAIA","src24":"Forecast","src26":"Novedades"};
const REMOVED_DEFAULT_IDS=new Set(["repo-completo-23","repo-completo-8","repo-completo-9","repo-completo-16","repo-completo-18","repo-completo-0","repo-completo-19","repo-completo-25","repo-completo-26","repo-completo-27","repo-completo-28","repo-completo-29","repo-completo-30","repo-completo-32","repo-completo-34","repo-completo-35","repo-completo-12","repo-completo-13","repo-completo-11","src35","srcE24","srcF24"]);const cleanEntries=entries.filter(e=>!REMOVED_DEFAULT_IDS.has(e.id));if(cleanEntries.length!==entries.length){entries=cleanEntries;localStorage.setItem(KEY,JSON.stringify(entries))}
let renamed=false;for(const e of entries){if(SHORT_NAMES[e.id]&&(e.title===OLD_NAMES[e.id]||PREVIOUS_NAMES[e.id]===e.title)){e.title=SHORT_NAMES[e.id];renamed=true}}if(renamed)localStorage.setItem(KEY,JSON.stringify(entries));
if(!entries.some(e=>e.id==='instructivo-team')){entries.push(INITIAL.find(e=>e.id==='instructivo-team'));localStorage.setItem(KEY,JSON.stringify(entries))}
const repoKey=s=>{const m=s.match(/\/(?:d|folders)\/([^/?#]+)/);return m?m[1]:(s.match(/[?&]id=([^&]+)/)?.[1]||s.split('?')[0].replace(/\/$/,''))};const existingRepoIds=new Set(entries.map(x=>repoKey(x.url)));let newLinks=0;for(const item of INITIAL){if(!item.id.startsWith('repo-completo-'))continue;const k=repoKey(item.url);if(!existingRepoIds.has(k)){entries.push(item);existingRepoIds.add(k);newLinks++}}if(newLinks)localStorage.setItem(KEY,JSON.stringify(entries));
for(const item of entries){if(item.id==="repo-completo-14"&&/^Rentabilidad(?:\s+YP[DF])?$/i.test(item.title)){item.title='Rentabilidad';localStorage.setItem(KEY,JSON.stringify(entries))}}
// Nuevos accesos incorporados desde la página principal de LinksPM.
let linksPmChanged=false;for(const item of INITIAL){if(!item.id.startsWith('linkspm-'))continue;if(!entries.some(e=>e.id===item.id||e.url.split('?')[0]===item.url.split('?')[0])){entries.push(item);linksPmChanged=true}}if(linksPmChanged)localStorage.setItem(KEY,JSON.stringify(entries));
for(const item of entries){if(item.id==="repo-completo-3"&&item.title==='Horas equipo YPF'){item.title='Horas equipo';localStorage.setItem(KEY,JSON.stringify(entries))}}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(entries));
const billingIds=new Set(['src10','src20','src6','src9','src8','repo-completo-3','repo-completo-39','repo-completo-43']);
const folderNames=['Facturación','Forecast y rentabilidad','Licencias','Personas y beneficios','Instructivos y recursos','Capacitación y certificaciones','Gestión y organización'];
function folderFor(x){if(billingIds.has(x.id)||['Facturación','Tarifas'].includes(x.category))return 'Facturación';if(['Forecast','Rentabilidad'].includes(x.category))return 'Forecast y rentabilidad';if(x.category==='Licencias')return 'Licencias';if(['Beneficios','Recibos','Salarios'].includes(x.category))return 'Personas y beneficios';if(['Soporte','Instructivos','Instructivo','Recursos corporativos'].includes(x.category))return 'Instructivos y recursos';if(x.category==='Certificación')return 'Capacitación y certificaciones';return 'Gestión y organización'}
let expanded='Facturación',tab='inicio';
function matching(){const q=$('search').value.toLocaleLowerCase('es').trim(),c=$('client').value;return entries.filter(e=>(!c||e.client===c)&&(!q||[e.title,e.description,e.category,e.client,...(e.tasks||[])].join(' ').toLocaleLowerCase('es').includes(q))).sort((a,b)=>$('sort').value==='recent'?entries.indexOf(b)-entries.indexOf(a):a.title.localeCompare(b.title,'es',{sensitivity:'base'}))}
function actions(x){return `<button type="button" class="star ${x.favorite?'on':''}" data-fav="${esc(x.id)}" aria-label="${x.favorite?'Quitar favorito':'Agregar favorito'}" title="Favorito">${x.favorite?'★':'☆'}</button><button type="button" class="more" data-edit="${esc(x.id)}" aria-label="Editar enlace" title="Editar">···</button>`}
function render(){
 const clients=[...new Set(entries.map(e=>e.client).filter(Boolean))].sort();
 const client=$('client').value;
 $('client').innerHTML='<option value="">Todos los clientes</option>'+clients.map(c=>`<option value="${esc(c)}" ${c===client?'selected':''}>${esc(c)}</option>`).join('');
 let match=matching(),q=$('search').value.trim();
 if(tab==='favoritos')match=match.filter(x=>x.favorite);
 const filtered=q||$('client').value||tab==='favoritos',groups=folderNames.map(name=>({name,items:match.filter(e=>folderFor(e)===name)})).filter(g=>g.items.length);
 $('resourceCount').textContent=match.length+' enlaces';
 $('quickSection').style.display=tab==='favoritos'?'none':'';
 const favs=entries.filter(x=>x.favorite).slice(0,6);
 $('quickCount').textContent=favs.length+' accesos';
 $('quick').innerHTML=favs.length?favs.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><span class="qi">↗</span><span class="qt">${esc(x.title)}</span><span class="qo">↗</span></a>`).join(''):'<span class="empty-quick">Marcá una estrella para agregar accesos aquí.</span>';
 $('folderTitle').textContent=tab==='favoritos'?'Mis favoritos':'Mis carpetas';

 $('folders').innerHTML=groups.map(g=>{const open=filtered||expanded===g.name;return `<div class="folder ${open?'active':''}" data-folder="${esc(g.name)}"><button type="button" class="folder-btn" data-toggle="${esc(g.name)}" aria-expanded="${open}"><span class="folder-icon">▣</span><span class="folder-name">${esc(g.name)}</span><span class="folder-count">${g.items.length}</span><span class="folder-chevron">${open?'⌄':'›'}</span></button>${open?`<div class="folder-items">${g.items.map(x=>`<div class="folder-item"><span class="mark">↗</span><a class="item-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>${actions(x)}</div>`).join('')}</div>`:''}</div>`}).join('')||'<div class="no-results">No se encontraron enlaces.</div>';
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const name=b.dataset.toggle;expanded=expanded===name?'':name;render()});
 document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const x=entries.find(e=>e.id===b.dataset.fav);if(x){x.favorite=!x.favorite;save();render()}});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openDialog(b.dataset.edit));
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
}
document.addEventListener('click',event=>{if(!expanded)return;if(event.target.closest('.folder')||event.target.closest('.modal'))return;expanded='';render()});
function openDialog(id){const x=entries.find(e=>e.id===id);$('modalTitle').textContent=x?'Editar enlace':'Nuevo enlace';$('entryId').value=x?.id||'';$('name').value=x?.title||'';$('url').value=x?.url||'';$('category').value=x?.category||'';$('entryClient').value=x?.client||'YPF';$('description').value=x?.description||'';$('favorite').checked=!!x?.favorite;$('deleteBtn').style.display=x?'':'none';$('categoryHints').innerHTML=[...new Set(entries.map(x=>x.category))].map(c=>`<option value="${esc(c)}"></option>`).join('');$('backdrop').classList.add('show');$('name').focus()}
function closeDialog(){$('backdrop').classList.remove('show')}
$('cancelBtn').onclick=closeDialog;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))closeDialog()};
$('form').onsubmit=e=>{e.preventDefault();const id=$('entryId').value,prev=entries.find(x=>x.id===id);const item={id:id||'custom-'+Date.now(),title:$('name').value.trim(),url:$('url').value.trim(),category:$('category').value.trim(),client:$('entryClient').value.trim(),description:$('description').value.trim(),favorite:$('favorite').checked,tasks:prev?.tasks||[],source:prev?.source||'Agregado manualmente'};if(!/^https?:\/\//i.test(item.url)){alert('Ingresá un enlace válido');return}if(prev)Object.assign(prev,item);else entries.unshift(item);save();closeDialog();render()};
$('deleteBtn').onclick=()=>{if(confirm('¿Eliminar este enlace?')){entries=entries.filter(x=>x.id!==$('entryId').value);save();closeDialog();render()}};

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;expanded=tab==='inicio'?'Facturación':'';$('search').value='';render();if(tab==='carpetas')document.getElementById('folderTitle').scrollIntoView({behavior:'smooth',block:'start'})});
$('search').addEventListener('input',render);$('client').addEventListener('change',render);$('sort').addEventListener('change',render);
render();
</script></body></html>
